<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111b20">
  <meta name="description" content="剧场时间机器：探索四个历史时期的微缩剧场，理解舞台形态与观演关系。">
  <title>Theatre Time Machine｜剧场时间机器</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./data.js"></script>
  <script defer src="./engine.js"></script>
  <script defer src="./scenes.js"></script>
  <script defer src="./app.js"></script>
</head>
<body data-screen="home">
  <div class="shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="剧场时间机器首页">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 9a12 12 0 0 0 24 0M8 9a8 8 0 0 0 16 0M12 9a4 4 0 0 0 8 0"
                fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M6 5h20" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>THEATRE<small>TIME MACHINE</small></span>
      </button>
      <div class="top-actions">
        <button data-action="help">玩法</button>
        <button data-action="recap">时空护照</button>
        <button data-action="share" class="desktop-extra">分享</button>
        <button data-action="fullscreen" class="desktop-extra">全屏</button>
      </div>
    </header>

    <main id="main">
      <section id="intro" aria-label="开始探索">
        <div class="eyebrow">AN INTERACTIVE THEATRE ATLAS</div>
        <p class="home-chinese">剧场时间机器</p>
        <h1>Theatre<br>Time Machine<span class="accent">.</span></h1>
        <p class="home-subtitle">5分钟穿越西方舞台剧场史</p>
        <p class="home-copy">
          旋转一座剧场，走进一个时代。<br>
          从空间出发，发现表演与观看的关系。
        </p>
        <button class="primary start" data-action="start">
          开始探索 <span>Start ↗</span>
        </button>
        <p class="orientation">▱ 建议手机横屏体验 · 下方可直选时期</p>
      </section>

      <section id="stage-area" aria-label="可交互三维剧场">
        <canvas id="canvas" tabindex="0"
          aria-label="三维剧场。可拖动旋转、双指缩放，或用方向键及加减键操作。"></canvas>

        <div class="scene-heading">
          <div class="eyebrow" id="scene-kicker">01 / ANCIENT GREECE</div>
          <h2 id="scene-title">古希腊</h2>
          <p id="scene-date"></p>
        </div>

        <div class="home-model-label">
          <span>EXHIBIT 001</span>
          <strong>Ancient Greece</strong>
          <small>古希腊 · 微缩剧场</small>
        </div>

        <div id="hotspots"></div>

        <div id="fallback" class="fallback" hidden>
          <strong>3D 显示提示</strong>
          <p id="fallback-text"></p>
          <p>热点文字与小测验仍可使用。空间实验请在启用 WebGL 的浏览器中完成。</p>
        </div>

        <div class="camera-tools" aria-label="镜头控制">
          <button data-action="overview" title="恢复总览视角">复位</button>
          <button data-action="zoom" data-value=".85" aria-label="放大">＋</button>
          <button data-action="zoom" data-value="1.18" aria-label="缩小">−</button>
        </div>

        <div class="scene-bottom">
          <div>
            <span id="scene-hint">单指旋转 · 双指缩放 · 点击编号探索</span>
            <small id="scene-model-note">教学示意模型</small>
          </div>
          <button id="relation" data-action="relation" aria-pressed="false">观演关系</button>
        </div>
      </section>

      <aside id="sidebar" aria-label="探索与任务">
        <div class="progress-wrap">
          <span id="progress-text"></span>
          <progress id="progress" max="8" value="0" aria-label="当前时期探索进度"></progress>
        </div>
        <nav id="mode-tabs" aria-label="体验模式"></nav>
        <div id="card"></div>
        <p id="storage-note" hidden>当前浏览器限制本地保存，记录仅在本次会话有效。</p>
      </aside>
    </main>

    <footer>
      <nav id="era-nav" aria-label="历史时期选择"></nav>
    </footer>
  </div>

  <dialog id="modal" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button data-action="close" aria-label="关闭弹窗">✕</button>
    </div>
    <div id="modal-body"></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="no-script">请启用浏览器 JavaScript 后体验剧场时间机器。</div>
  </noscript>
</body>
</html>
